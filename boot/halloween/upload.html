<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haunted Wall</title>
<style>
@font-face { font-family: 'Creepster'; src: url('fonts/Creepster.woff2') format('woff2'); }
body { margin: 0; background: #0b0710; color: #e8e2f0; font: 17px/1.45 -apple-system, system-ui, sans-serif; padding: 24px 18px 60px; }
h1 { font-family: Creepster, Impact, sans-serif; font-weight: normal; color: #ff7a1a; font-size: 44px; margin: 0 0 4px; letter-spacing: 1px; }
p { margin: 6px 0 14px; color: #b8b0c8; }
.card { background: #171022; border: 1px solid #2d2340; border-radius: 14px; padding: 18px; margin: 18px 0; }
label.btn, button { display: block; width: 100%; box-sizing: border-box; text-align: center; background: #ff7a1a; color: #140a00; font-weight: 700; font-size: 19px; padding: 16px; border-radius: 12px; border: 0; cursor: pointer; }
button.alt { background: #6d3df0; color: #fff; }
input[type=file] { display: none; }
input[type=text] { width: 100%; box-sizing: border-box; font-size: 18px; padding: 14px; border-radius: 10px; border: 1px solid #3a2d50; background: #0e0916; color: #fff; margin-bottom: 10px; }
#status { min-height: 24px; color: #9fe870; margin-top: 10px; }
#thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
#thumbs img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 2px solid #2d2340; }
small { color: #7d7590; }
</style>
</head>
<body>
<h1>Haunted Wall</h1>
<p>Photos you add here appear on the wall as jump scares, each one up to <span id="max">2</span> times. Nobody is warned.</p>

<div class="card">
  <label class="btn" for="file">Add photos from camera roll</label>
  <input id="file" type="file" accept="image/*" multiple>
  <div id="status"></div>
  <div id="thumbs"></div>
  <small>Photos are shrunk to screen size before upload, so this is quick on WiFi.</small>
</div>

<div class="card">
  <input id="msg" type="text" maxlength="60" placeholder="Write a creepy message for the wall">
  <button class="alt" id="send">Send message</button>
  <div id="msgstatus"></div>
</div>

<div class="card">
  <input id="oq" type="text" maxlength="80" placeholder="Ask the spirits a question…">
  <button class="alt" id="ask">Ask the board</button>
  <div id="oqstatus"></div>
</div>

<div class="card"><small id="info">Loading…</small></div>

<script>
const $ = s => document.querySelector(s);
async function shrink(file, max = 1920) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  await new Promise((ok, err) => { img.onload = ok; img.onerror = err; img.src = url; });
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  return new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.86));
}
$('#file').addEventListener('change', async (e) => {
  const files = [...e.target.files]; let n = 0;
  for (const f of files) {
    $('#status').textContent = `Uploading ${n + 1} of ${files.length}…`;
    try {
      const blob = await shrink(f);
      const r = await fetch('/api/upload', { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: blob });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'upload failed');
      const t = document.createElement('img'); t.src = URL.createObjectURL(blob); $('#thumbs').prepend(t); n++;
    } catch (err) { $('#status').textContent = 'Problem with one photo: ' + err.message; await new Promise(r => setTimeout(r, 1500)); }
  }
  $('#status').textContent = n ? `${n} photo${n > 1 ? 's' : ''} on the wall soon. Watch their faces.` : $('#status').textContent;
  e.target.value = ''; refresh();
});
$('#send').addEventListener('click', async () => {
  const message = $('#msg').value.trim(); if (!message) return;
  const r = await fetch('/api/message', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message }) });
  const j = await r.json();
  $('#msgstatus').textContent = j.ok ? 'Added. It will show up in the message scene.' : ('Error: ' + j.error);
  $('#msg').value = '';
});
async function refresh() {
  try { const j = await (await fetch('/api/photos')).json(); $('#info').textContent = `${j.photos.length} photo${j.photos.length === 1 ? '' : 's'} and ${j.messages.length} custom message${j.messages.length === 1 ? '' : 's'} loaded on the wall.`; }
  catch (e) { $('#info').textContent = 'Cannot reach the wall server.'; }
}
refresh();
$('#ask').onclick = async () => {
  const question = $('#oq').value.trim(); if (!question) return;
  $('#oqstatus').textContent = 'The spirits are stirring\u2026';
  try {
    const r = await fetch('/api/ouija', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question }) });
    const j = await r.json();
    $('#oqstatus').textContent = j.ok ? 'The board is listening. Watch the wall\u2026' : ('Error: ' + j.error);
    if (j.ok) $('#oq').value = '';
  } catch (e) { $('#oqstatus').textContent = 'The spirits are unreachable.'; }
};
</script>
</body>
</html>
